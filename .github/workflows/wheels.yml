name: Build & Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install numpy pytest build twine

      - name: Build
        run: |
          python -m build

      - name: Install Wheel
        run: |
          pip install dist/*.whl

      - name: Run Tests
        run: pytest
