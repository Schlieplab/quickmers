[build-system]
requires = ["setuptools>=68", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "quickmers"
version = "0.2.1"
description = "Fast k-mer distance utilities in C with Python bindings"
readme = "README.md"
requires-python = ">=3.9"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: OS Independent"
]

authors = [
    {name = "Kian Jalilian", email = "kian2000.jalilian@gmail.com"}
]

maintainers = [
    {name = "Nathalie Gocht", email = "nathalie.gocht@b-tu.de"},
    {name = "Kian Jalilian", email = "kian2000.jalilian@gmail.com"}
]

dependencies = [
    "numpy>=1.24"
]

[project.urls]
Homepage = "https://github.com/Schlieplab/quickmers"
Source = "https://github.com/Schlieplab/quickmers"
Issues = "https://github.com/Schlieplab/quickmers/issues"

[tool.setuptools.packages.find]
include = ["quickmers*"]

[tool.pytest.ini_options]
markers = [
    "slow: long-running benchmarks, excluded in CI (run with -m slow)",
]