[build-system]
requires = ["setuptools>=68", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "quickmers"
version = "0.1.0"
description = "Fast k-mer distance utilities in C with Python bindings"
readme = "README.md"
requires-python = ">=3.9"
license = {text="LGPL-3.0-or-later"}
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: OS Independent"
]

authors = [
    {name="Kian Jalilian", email="jalilkia@b-tu.de"}
]

maintainers = [
    {name="Nathalie Gocht", email="nathalie.gocht@b-tu.de"},
    {name="Kian Jalilian", email="jalilkia@b-tu.de"}
]

dependencies = [
    "numpy>=1.24"
]

[tool.setuptools.packages.find]
include = ["quickmers*"]
